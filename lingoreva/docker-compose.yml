version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: lingoreva
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/lingoreva
      - DB_DRIVER=org.postgresql.Driver
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=8f000b201a084628f24b2ab870c57c2a715fbc7058df8a2f1de9e1c26b52780a4f5f5c76db3647f07cb81e97cd77db084c01726a458b5be9d332d7ab2f6c054f
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8080
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend

volumes:
  pgdata:
