spring:
  application:
    name: lingoreva
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/lingoreva_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:sa}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:8f000b201a084628f24b2ab870c57c2a715fbc7058df8a2f1de9e1c26b52780a4f5f5c76db3647f07cb81e97cd77db084c01726a458b5be9d332d7ab2f6c054f}
  expiration: 86400000

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.lingoreva: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
